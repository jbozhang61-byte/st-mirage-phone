name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'preview/**'
      - 'css/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web assets
        run: node desktop/build-web.mjs

      - name: Create capacitor workspace
        run: |
          set -x
          rm -rf build-app
          mkdir -p build-app/www
          cp -r desktop/www/. build-app/www/
          cd build-app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          printf '%s' '{"appId":"com.mirage.phone","appName":"MiragePhone","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          cat capacitor.config.json
          ls -la
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd build-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mirage-phone-apk
          path: build-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 幻镜手机 APK（最新）
          body: 自动构建的 debug APK，直接下载安装即可。
          files: build-app/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
