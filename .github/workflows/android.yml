name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'preview/**'
      - 'css/**'
      - 'android-webview/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets
        run: |
          node desktop/build-web.mjs
          mkdir -p android-webview/app/src/main/assets
          rm -rf android-webview/app/src/main/assets/www
          cp -r desktop/www android-webview/app/src/main/assets/www
          ls android-webview/app/src/main/assets/www

      - name: Setup Gradle
        run: |
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          echo "GRADLE=/tmp/gradle-8.7/bin/gradle" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd android-webview
          $GRADLE assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mirage-phone-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 幻镜手机 APK（最新）
          body: 自动构建的 debug APK，直接下载安装即可。
          files: android-webview/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
