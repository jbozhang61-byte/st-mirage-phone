# 桌面版打包配置（生成 Windows 安装包）
appId: com.mirage.phone.desktop
productName: 幻镜手机
directories:
  output: dist
files:
  - main.js
  - bridge.js
  - preload.js
  - build-web.mjs
  - package.json
  - www/**/*
extraMetadata:
  main: main.js
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
